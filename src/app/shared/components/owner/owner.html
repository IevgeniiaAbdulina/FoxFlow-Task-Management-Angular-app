<link
  href="https://avatars.githubusercontent.com"
  rel="preconnect" />

<a
  target="_blank"
  [href]="owner().gitHub">
  <mat-card
    appearance="outlined"
    class="card">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title>{{ owner().name }}</mat-card-title>
        <mat-card-subtitle>{{ owner().position }}</mat-card-subtitle>
        <img
          alt="avatar"
          class="card__image"
          height="50"
          mat-card-md-image
          ngSrc="{{ owner().image }}"
          priority
          width="50" />
      </mat-card-title-group>
    </mat-card-header>
    <mat-card-content class="card__content">
      gitHub {{ owner().name }}
    </mat-card-content>
  </mat-card>
</a>

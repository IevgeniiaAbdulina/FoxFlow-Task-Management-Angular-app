<div
  aria-label="Page not found"
  class="not-found"
  role="alert">
  <img
    alt="400 Not Found"
    height="500"
    ngSrc="assets/images/404-not-found.svg"
    priority="high"
    width="750" />
  <h1>{{ 'NOT_FOUND.MESSAGE' | translate }}</h1>
  <a
    aria-label="Return to home page"
    color="primary"
    mat-raised-button
    routerLink="/">
    {{ 'NOT_FOUND.HOME' | translate }}
  </a>
</div>

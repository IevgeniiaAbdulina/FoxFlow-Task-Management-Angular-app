<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    [mat-dialog-close]="false"
    >{{ data.cancelText }}
  </button>
  <button
    cdkFocusInitial
    color="warn"
    mat-button
    type="button"
    [mat-dialog-close]="true">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>

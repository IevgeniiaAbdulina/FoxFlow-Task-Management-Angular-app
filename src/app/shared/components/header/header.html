<mat-toolbar
  aria-label="Main navigation"
  color="primary"
  role="banner">
  <div class="header-container">
    @let isMobile = isMobile$ | async;
    <a
      aria-label="FoxFlow Home"
      class="logo"
      routerLink="/">
      <img
        alt="FoxFlow Logo"
        height="48"
        ngSrc="assets/images/logo.png"
        priority="high"
        width="48" />
      <span>FoxFlow</span>
    </a>
    <span class="spacer"></span>
    <app-language-switcher />
    <mat-slide-toggle
      aria-label="Toggle dark/light theme"
      class="icon-only-toggle"
      matTooltip="Toggle dark/light theme"
      matTooltipPosition="above"
      [checked]="isDarkMode()"
      (change)="toggleTheme()">
      <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </mat-slide-toggle>
    @if (!isAuthenticated() && isMobile) {
    <button
      aria-label="Open navigation menu"
      mat-icon-button
      type="button"
      [matMenuTriggerFor]="menu"
      [matMenuTriggerRestoreFocus]="true">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu
      #menu="matMenu"
      overlapTrigger="false"
      xPosition="before">
      <button
        aria-label="Log in"
        mat-menu-item
        routerLink="/login"
        type="button">
        {{ 'AUTH.LOGIN' | translate }}
      </button>
      <button
        aria-label="Register"
        mat-menu-item
        routerLink="/register"
        type="button">
        {{ 'AUTH.REGISTER' | translate }}
      </button>
    </mat-menu>
    } @if (!isAuthenticated() && !isMobile) {
    <div class="nav-links">
      <a
        aria-label="Log in"
        mat-button
        routerLink="/login"
        routerLinkActive="active">
        {{ 'AUTH.LOGIN' | translate }}
      </a>
      <a
        aria-label="Register"
        matButton="filled"
        routerLink="/register"
        routerLinkActive="active">
        {{ 'AUTH.REGISTER' | translate }}
      </a>
    </div>
    }
    <button
      aria-label="Logout button"
      class="example-icon"
      matIconButton
      matTooltip="Logout"
      type="button"
      (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>

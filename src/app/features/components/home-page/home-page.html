<p>HOME-page works!</p>
<div>
  <h2>Registration works:</h2>

  @if (user$()) {
  <h3>Good afternoon, {{ user$()?.displayName }}</h3>
  <img
    alt="User photo"
    height="50"
    width="50"
    [ngSrc]="user$()?.photoURL ?? 'assets/images/logo-48x48.png'" />
  <span [style.color]="'grey'">{{ user$()?.email }}</span>
  }
</div>

<button
  type="button"
  (click)="logout()">
  Logout
</button>
<p>Page only for logged in users!</p>
